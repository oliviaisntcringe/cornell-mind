name: INTR
options:
  bundleIdPrefix: dev.gleb
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    ENABLE_HARDENED_RUNTIME: YES
packages:
  SwiftTransformers:
    url: https://github.com/huggingface/swift-transformers
    from: 1.3.0
targets:
  INTR:
    type: application
    platform: macOS
    sources:
      - path: CornellMind
        excludes:
          - Resources/Tokenizer
          - Resources/Models
      - path: CornellMind/Resources/Tokenizer/QG
        type: folder
      - path: CornellMind/Resources/Tokenizer/Embedder
        type: folder
      - path: CornellMind/Resources/Models/Embedder.mlpackage
      - path: CornellMind/Resources/Models/QGEncoder.mlpackage
      - path: CornellMind/Resources/Models/QGDecoder.mlpackage
    resources:
      - CornellMind/Resources/Models/TOKENIZERS.md
    dependencies:
      - package: SwiftTransformers
        product: Tokenizers
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: INTR.
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        PRODUCT_NAME: INTR
        ENABLE_PREVIEWS: YES
        DEVELOPMENT_ASSET_PATHS: ""
schemes:
  INTR:
    build:
      targets:
        INTR: all
    run:
      config: Debug
    archive:
      config: Release
    profile:
      config: Release
    analyze:
      config: Debug